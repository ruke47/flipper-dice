cargo-features = ["different-binary-name"]

[package]
name = "flipper-dice"
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "flipper-dice"
filename = "flipper-dice.fap"
bench = false
test = false

[dependencies]
flipperzero = { version = "0.13.0", features = ["alloc"] }
flipperzero-alloc = { version = "0.13.0" }
flipperzero-sys = { version = "0.13.0" }
flipperzero-rt = { version = "0.13.0" }
